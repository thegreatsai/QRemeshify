[project]
name = "wrap3d-prototype"
version = "0.1.0"
description = "Standalone mesh unwrap/wrap tool prototype (Wrap3D-style workflow)"
requires-python = ">=3.10"
dependencies = [
    "moderngl>=5.10",
    "moderngl-window>=2.4",
    "imgui[glfw]>=2.0",
    "numpy>=1.26",
    "trimesh>=4.0",
    "pyrr>=0.10",
    "scipy>=1.11",
    "xatlas>=0.0.9",
    "shapely>=2.0",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
include = ["wrap3d*"]
